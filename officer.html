<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARE - Officer Command Center</title>
  <style>
    :root {
      --primary: #b71c1c;
      --primary-dark: #7f0000;
      --bg: #eef2f5;
      --surface: #ffffff;
      --text: #212121;
      --border: #cfd8dc;
      --radius: 12px;
      --shadow: 0 4px 14px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }

    .header {
      background: linear-gradient(135deg, #7f0000, #b71c1c);
      color: white; padding: 28px 16px; text-align: center; box-shadow: var(--shadow);
    }
    .header h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: 0.5px; }
    .header p { font-size: 0.95rem; opacity: 0.9; margin-top: 4px; }

    .container { max-width: 750px; margin: 20px auto; padding: 0 16px; }

    .card {
      background: var(--surface); border-radius: var(--radius); padding: 24px;
      margin-bottom: 20px; border: 1px solid var(--border); box-shadow: var(--shadow);
    }
    .card h2 {
      font-size: 1.25rem; color: var(--primary-dark); border-bottom: 2px solid var(--border);
      padding-bottom: 10px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center;
    }

    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; color: #444; margin-bottom: 6px; text-transform: uppercase; }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 1rem; outline: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }

    .btn-broadcast {
      width: 100%; background: linear-gradient(135deg, #d32f2f, #b71c1c); color: white;
      border: none; padding: 16px; border-radius: 8px; font-size: 1.15rem; font-weight: 800;
      cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 4px 12px rgba(183, 28, 28, 0.35); transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-broadcast:disabled { opacity: 0.65; cursor: not-allowed; }

    .spinner {
      width: 22px; height: 22px; border: 3px solid #ffffff; border-top: 3px solid transparent;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* SUMMARY TILES */
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .tile { background: #f8f9fa; border: 1px solid var(--border); border-radius: 8px; padding: 14px; text-align: center; }
    .tile-val { font-size: 1.5rem; font-weight: 800; color: var(--primary-dark); }
    .tile-lbl { font-size: 0.75rem; font-weight: 700; color: #666; text-transform: uppercase; }

    .hidden { display: none !important; }

    /* CUSTOM MODAL POPUP */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card {
      background: white; border-radius: 16px; padding: 24px; text-align: center;
      max-width: 420px; width: 100%; box-shadow: 0 12px 32px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🚨 CARE COMMAND CENTER</h1>
    <p>Disaster Risk Reduction Management Emergency Broadcast Engine</p>
  </div>

  <div class="container">

    <div class="card">
      <h2>Broadcast Emergency Alert</h2>

      <div class="form-group">
        <label for="alert-title">Emergency Alert Title</label>
        <input type="text" id="alert-title" placeholder="e.g. 🚨 RED ALERT: Typhoon Evacuation Warning">
      </div>

      <div class="form-group">
        <label for="alert-message">Emergency Message Body</label>
        <textarea id="alert-message" rows="3" placeholder="Type instructions for Cooperative Members..."></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="alert-category">Disaster Category</label>
          <select id="alert-category">
            <option value="TYPHOON">🌀 Typhoon</option>
            <option value="FLOOD">🌊 Flood</option>
            <option value="EARTHQUAKE">🌋 Earthquake</option>
            <option value="FIRE">🔥 Fire Emergency</option>
            <option value="LANDSLIDE">⛰️ Landslide Warning</option>
            <option value="ADVISORY">📢 General Advisory</option>
          </select>
        </div>

        <div class="form-group">
          <label for="alert-priority">Priority Level</label>
          <select id="alert-priority">
            <option value="CRITICAL">🚨 CRITICAL (High Vibration & Sound)</option>
            <option value="HIGH">⚠️ HIGH</option>
            <option value="MODERATE">ℹ️ MODERATE</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="target-type">Recipient Filter</label>
        <select id="target-type" onchange="handleTargetChange()">
          <option value="ALL">🌐 ALL COOPERATIVE MEMBERS (~20,000 via FCM Topic)</option>
          <option value="BRANCH">🏢 By Branch</option>
          <option value="PROVINCE">📍 By Province</option>
          <option value="MUNICIPALITY">🏙️ By Municipality</option>
          <option value="MEMBER">👤 Single Member ID</option>
        </select>
      </div>

      <div id="target-value-group" class="form-group hidden">
        <label id="target-value-label" for="target-value">Filter Value</label>
        <input type="text" id="target-value" placeholder="Enter target filter value...">
      </div>

      <button id="btn-broadcast" class="btn-broadcast" onclick="dispatchEmergencyAlert()">
        <span>⚡ BROADCAST EMERGENCY ALERT NOW</span>
      </button>

      <div id="summary-grid" class="summary-grid hidden">
        <div class="tile">
          <div id="sum-targeted" class="tile-val">0</div>
          <div class="tile-lbl">Targeted</div>
        </div>
        <div class="tile">
          <div id="sum-sent" class="tile-val" style="color:#2e7d32;">0</div>
          <div class="tile-lbl">Delivered</div>
        </div>
        <div class="tile">
          <div id="sum-failed" class="tile-val" style="color:#c62828;">0</div>
          <div class="tile-lbl">Failed</div>
        </div>
      </div>
    </div>

    <!-- LIVE SAFETY FEED -->
    <div class="card">
      <h2>
        <span>Live Member Safety Logs</span>
        <button onclick="loadSafetyLogs()" style="background:#1976d2; color:white; border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;">🔄 Refresh</button>
      </h2>

      <table style="width: 100%; border-collapse: collapse; font-size: 0.88rem;">
        <thead>
          <tr style="background: #f0f4f8; text-align: left;">
            <th style="padding: 10px;">Member ID</th>
            <th style="padding: 10px;">Status</th>
            <th style="padding: 10px;">GPS Location</th>
            <th style="padding: 10px;">Timestamp</th>
          </tr>
        </thead>
        <tbody id="safety-logs-body">
          <tr><td colspan="4" style="padding:14px; text-align:center;">Loading logs...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- MODAL -->
  <div id="custom-modal" class="modal-overlay">
    <div class="modal-card">
      <div id="modal-icon" style="font-size:3rem; margin-bottom:10px;">🚨</div>
      <div id="modal-title" style="font-size:1.2rem; font-weight:800; margin-bottom:8px;">Broadcast Confirmation</div>
      <div id="modal-body" style="font-size:0.9rem; color:#555; margin-bottom:20px;">Are you sure?</div>
      <div style="display:flex; gap:10px;">
        <button onclick="closeModal()" style="flex:1; padding:12px; border-radius:8px; border:1px solid #ccc; background:#fff; font-weight:bold;">Cancel</button>
        <button id="modal-confirm-btn" style="flex:1; padding:12px; border-radius:8px; border:none; background:#b71c1c; color:#fff; font-weight:bold;">Confirm Dispatch</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_BACKEND_URL = "https://script.google.com/macros/s/AKfycbyd1L-Cf-ZfoZiVCznAnONiCxuu9YaziM4H37R3PR0JeH8-HBYn6RAXagmb5DXdMm2T/exec";

    document.addEventListener("DOMContentLoaded", loadSafetyLogs);

    function handleTargetChange() {
      const type = document.getElementById("target-type").value;
      const group = document.getElementById("target-value-group");
      group.classList.toggle("hidden", type === "ALL");
    }

    function setBroadcastLoading(isLoading) {
      const btn = document.getElementById("btn-broadcast");
      if (isLoading) {
        btn.disabled = true;
        btn.innerHTML = `<div class="spinner"></div> <span>BROADCASTING TO MEMBERS...</span>`;
      } else {
        btn.disabled = false;
        btn.innerHTML = `<span>⚡ BROADCAST EMERGENCY ALERT NOW</span>`;
      }
    }

    function showConfirmModal(title, body, onConfirm) {
      document.getElementById("modal-title").textContent = title;
      document.getElementById("modal-body").textContent = body;
      document.getElementById("modal-confirm-btn").onclick = () => {
        closeModal();
        onConfirm();
      };
      document.getElementById("custom-modal").classList.add("active");
    }

    function closeModal() {
      document.getElementById("custom-modal").classList.remove("active");
    }

    async function dispatchEmergencyAlert() {
      const title = document.getElementById("alert-title").value;
      const message = document.getElementById("alert-message").value;
      const targetType = document.getElementById("target-type").value;
      const targetValue = document.getElementById("target-value").value;

      if (!title || !message) {
        alert("Enter alert title and message!");
        return;
      }

      showConfirmModal(
        "🚨 Confirm Broadcast Dispatch",
        `Broadcast alert: "${title}" to target "${targetType}"?`,
        async () => {
          setBroadcastLoading(true);

          try {
            const res = await fetch(GAS_BACKEND_URL, {
              method: "POST",
              body: JSON.stringify({
                action: "broadcastEmergencyAlert",
                title: title,
                message: message,
                category: document.getElementById("alert-category").value,
                priority: document.getElementById("alert-priority").value,
                targetType: targetType,
                targetValue: targetValue,
                senderId: "DRRMC-OFFICER-01"
              })
            }).then(r => r.json());

            setBroadcastLoading(false);

            if (res.success) {
              const sum = res.summary;
              document.getElementById("sum-targeted").textContent = sum.totalTargeted;
              document.getElementById("sum-sent").textContent = sum.totalSent;
              document.getElementById("sum-failed").textContent = sum.totalFailed;
              document.getElementById("summary-grid").classList.remove("hidden");
            } else {
              alert("Broadcast Failed: " + res.error);
            }
          } catch (e) {
            setBroadcastLoading(false);
            alert("Network Error: " + e.message);
          }
        }
      );
    }

    async function loadSafetyLogs() {
      const tbody = document.getElementById("safety-logs-body");
      try {
        const res = await fetch(GAS_BACKEND_URL, {
          method: "POST",
          body: JSON.stringify({ action: "getEmergencyStatusLogs" })
        }).then(r => r.json());

        if (res.success && res.logs.length > 0) {
          tbody.innerHTML = res.logs.map(log => `
            <tr style="border-bottom: 1px solid #eee;">
              <td style="padding:10px; font-weight:bold;">${log.memberId}</td>
              <td style="padding:10px;">
                <span style="padding:3px 8px; border-radius:4px; color:white; font-weight:bold; background:${log.type === 'SAFE' ? '#2e7d32' : '#b71c1c'}">
                  ${log.type === 'SAFE' ? '💚 SAFE' : '🚨 SOS HELP'}
                </span>
              </td>
              <td style="padding:10px;">
                ${log.mapLink && log.mapLink.includes('http') ? `<a href="${log.mapLink}" target="_blank" style="color:#1976d2;">📍 Map</a>` : 'No GPS'}
              </td>
              <td style="padding:10px; font-size:0.75rem;">${new Date(log.time).toLocaleTimeString()}</td>
            </tr>
          `).join('');
        }
      } catch (e) {
        tbody.innerHTML = "<tr><td colspan='4' style='padding:14px; text-align:center;'>Unable to load logs.</td></tr>";
      }
    }
  </script>
</body>
</html>
